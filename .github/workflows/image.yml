name: Image

# 운영 이미지 빌드 (M6 결정 6). 버전 태그(v*)를 올리거나 손으로 실행할 때만 만든다: main에 병합할 때마다 이미지가 쌓이지 않게.
# 테스트는 ci.yml이 돌린다. 이 워크플로는 서버에 접속하지 않는다(배포는 개발자가 서버에서 pull, docs/runbook.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # 이 저장소의 GITHUB_TOKEN으로 GHCR에 올린다 (따로 만든 토큰을 저장소에 두지 않는다)
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rentkeeper
          tags: |
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
