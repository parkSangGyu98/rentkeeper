# 의존성 취약점·업데이트 점검 (PRD 8.1 보안 체크리스트)
# cooldown 14일: 새 릴리스가 나온 뒤 2주가 지나야 PR을 연다 (버전 고정 규칙과 동일한 기준).
# 보안 업데이트(Dependabot security updates)는 cooldown과 무관하게 열린다.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci

  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 14
    ignore:
      # PRD는 PostgreSQL 16으로 정해져 있다. 16.x 마이너·패치는 받고, 메이저(17 이상)만 무시한다.
      # 메이저 업그레이드는 데이터 덤프/복원이 필요해 계획을 세운 뒤 수동으로 한다.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Docker 태그(-alpine)에서 위 semver 판정이 동작하는지 공식 문서로 확인하지 못해, 버전 범위로도 막는다
      - dependency-name: "postgres"
        versions: [">= 17"]
    commit-message:
      prefix: chore
