# 로컬 배포 리허설 전용 덮어쓰기 (chore/deploy-rehearsal). compose.prod.yml은 그대로 두고 포트와 설정 파일만 바꾼다.
# 저장소 루트에서 (Git Bash):
#   R="docker compose -p rentkeeper-rehearsal --env-file .env.rehearsal -f docker/compose.prod.yml -f docker/compose.rehearsal.yml"
#   $R up -d          # 확인: curl.exe -k https://localhost:8443/
#   $R down -v        # 끝나면 컨테이너와 볼륨을 함께 지운다
# - 프로젝트 이름은 아래 name으로 정한다(뒤에 오는 이 파일의 name이 compose.prod.yml의 name: rentkeeper를 덮는다). 그래서 컨테이너·볼륨
#   이름이 rentkeeper-rehearsal-…로 만들어져 개발 DB(docker-compose.yml, 프로젝트 rentkeeper, 볼륨 rentkeeper_pgdata)와 겹치지 않는다.
#   위 R의 -p는 한 번 더 확실히 하려는 것이다. scripts/backup.sh처럼 compose.prod.yml만 읽는 명령은 이 이름을 모르므로
#   COMPOSE_PROJECT_NAME=rentkeeper-rehearsal을 따로 준다(runbook 13).
# - .env.rehearsal은 리허설용 임시 값으로 만들고 커밋하지 않는다(.gitignore의 .env.*). 이름 목록은 .env.prod.example과 같다.
#   DOMAIN=localhost로 두면 Caddy가 내부 인증서를 쓴다(밖으로 인증서를 받으러 가지 않는다). APP_IMAGE는 로컬에서 빌드한 이미지.
name: rentkeeper-rehearsal

services:
  app:
    env_file: !override
      - ../.env.rehearsal

  caddy:
    # 80·443 대신 이 PC에서만 닿는 포트 (8080 개발 앱과 겹치지 않게)
    ports: !override
      - "127.0.0.1:8081:80"
      - "127.0.0.1:8443:443"
