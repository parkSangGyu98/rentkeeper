# 테스트 전용 설정. classpath:/config/application.yml은 메인 application.yml보다 우선하고, 테스트 클래스패스에만 있다.
# 로컬 .env의 실제 키 대신 아래 가짜 키를 쓴다 (CI에는 .env가 없다).
app:
  encryption:
    # 테스트 전용 가짜 키 (비밀값 아님). Base64를 풀면 "rentkeeper-test-only-..." 문자열이다
    key: cmVudGtlZXBlci10ZXN0LW9ubHktZW5jLWtleS12MSE=
    key-version: 1
    previous-keys: ""
    hmac-key: cmVudGtlZXBlci10ZXN0LW9ubHktaG1hYy1rZXktMDE=
  notification:
    # 테스트에서는 발송 워커를 스케줄로 돌리지 않는다. 테스트가 NotificationWorker.runOnce()를 직접 부른다
    worker-cron: "-"
    # 운영 알림 메일 행이 "보낼 차례"로 만들어지는지 보려고 테스트에서는 주소를 둔다 (가짜 주소)
    ops-alert-email: ops@example.com
