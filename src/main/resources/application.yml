app:
  # 로그인 유지(remember-me) 키. 운영 필수(32자 이상), local은 비어 있으면 임시 키 (RememberMeKey, ADR-013)
  remember-me-key: ${APP_REMEMBER_ME_KEY:}
  kakao:
    # 카카오 로그인 (ADR-014). 셋 다 없으면 local·CI에서는 카카오 로그인을 끄고, 운영(prod)에서는 기동하지 않는다.
    # 일부만 있으면 설정 실수로 보고 기동하지 않는다 (KakaoProperties)
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    # 서비스 앱 어드민 키: 탈퇴 시 카카오 연결 끊기(unlink)에 쓴다. 서버에서만 쓰고 절대 화면·로그에 내보내지 않는다
    admin-key: ${KAKAO_ADMIN_KEY:}
    # 요청할 동의항목. 이메일(account_email)은 카카오 콘솔에서 "권한 없음"(개인 개발자 앱, 비즈 앱 전환 필요)이라 빼고
    # 닉네임만 요청한다. 알림 이메일은 가입 단계에서 직접 입력받아 우리 인증 메일로 확인한다 (ADR-014)
    scopes: profile_nickname

spring:
  application:
    name: rentkeeper
  profiles:
    # 운영은 SPRING_PROFILES_ACTIVE=prod로 명시한다
    default: local
  datasource:
    # 비밀값은 코드에 두지 않고 환경변수(로컬은 .env)로 주입한다 (PRD 13장)
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    # 뷰 렌더링 중 지연 로딩 쿼리를 막아 트랜잭션 경계를 서비스 계층으로 한정한다
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 만든다. Hibernate는 엔티티와 스키마가 맞는지 검증만 한다
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # ADR-002: 순간(timestamptz)은 UTC 기준으로 읽고 쓴다
          time_zone: UTC
  session:
    # 아무 요청이 없으면 2시간 뒤 로그아웃. 오래 유지하는 로그인은 M1-b의 remember-me(30일)가 맡는다.
    # server.servlet.session.timeout이 아니라 여기에 둔다: 테스트(MockMvc)와 실제 실행 모두 이 값을 먼저 읽는다 (ADR-005).
    # 세션 쿠키 속성은 SessionCookieConfig에서 코드로 지정한다
    timeout: 2h
    jdbc:
      # 세션 테이블은 Flyway(V3)가 만든다. 앱이 시작할 때 DDL을 실행하지 않는다 (ADR-005)
      initialize-schema: never

server:
  error:
    # 사용자에게는 templates/error/*.html의 안내 문구만 보여 주고, 내부 정보는 서버 로그에만 남긴다 (PRD 7.4)
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
