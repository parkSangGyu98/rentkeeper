<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
<title th:text="|입금 기록 지우기 - #{app.name}|">입금 기록 지우기</title>
</head>
<body>
	<main id="main" class="page">
		<h1 class="mb-4 text-3xl font-bold">이 입금 기록을 지울까요?</h1>
		<p class="mb-2 text-xl font-semibold"><span th:text="${charge.unitName()} + ' · ' + ${charge.tenantName()} + '님'">행복빌라 101호 · 홍길동님</span>
			· <span th:text="${charge.monthText()}">2026년 10월</span></p>
		<p class="mb-4 text-2xl font-bold"><span th:text="${payment.amountText()}">550,000원</span> · <span th:text="${payment.paidOnText()} + ' 받음'">2026년 10월 5일 받음</span></p>
		<ul class="mb-6 list-disc space-y-1 pl-6 text-lg text-gray-700">
			<li>받은 금액에서 빠지고, 상태가 다시 계산돼요(다 받음이었다면 일부 받음이나 납부일 지남이 될 수 있어요).</li>
			<li>기록은 지운 기록으로 남아 상세 화면 아래에서 볼 수 있어요. 되살릴 수는 없어요.</li>
			<li>금액이나 날짜만 틀렸다면 지우지 말고 [고치기]를 쓰세요.</li>
		</ul>
		<form th:action="@{/app/charges/{id}/payments/{pid}/delete(id=${charge.id()},pid=${payment.id()})}" th:object="${form}" method="post" class="space-y-6" novalidate>
			<input type="hidden" th:field="*{version}">
			<div>
				<label for="reason" class="form-label">지우는 사유</label>
				<p id="reason-hint" class="mb-2 text-base text-gray-700">예: 다른 세입자 입금을 잘못 기록함</p>
				<input id="reason" type="text" th:field="*{reason}" class="form-input" aria-describedby="reason-hint"
					th:attr="aria-invalid=${#fields.hasErrors('reason')}">
				<p class="form-error" th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}">오류</p>
			</div>
			<button type="submit" class="btn btn-danger w-full">네, 지울게요</button>
		</form>
		<a th:href="@{/app/charges/{id}(id=${charge.id()})}" class="btn btn-secondary mt-4 w-full">지우지 않고 돌아가기</a>
	</main>
</body>
</html>
