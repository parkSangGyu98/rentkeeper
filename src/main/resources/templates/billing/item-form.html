<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
<title th:text="|항목 - #{app.name}|">항목</title>
</head>
<body>
	<main id="main" class="page">
		<h1 class="mb-2 text-3xl font-bold" th:text="${item == null} ? '항목 추가' : '항목 고치기'">항목 추가</h1>
		<p class="mb-6 text-xl"><span th:text="${charge.unitName()} + ' · ' + ${charge.tenantName()} + '님'">행복빌라 101호 · 홍길동님</span>
			· <span th:text="${charge.monthText()}">2026년 10월</span> 받을 월세</p>

		<form th:action="${item == null} ? @{/app/charges/{id}/items(id=${charge.id()})} : @{/app/charges/{id}/items/{itemId}(id=${charge.id()},itemId=${item.id()})}"
			th:object="${form}" method="post" class="space-y-6" novalidate>
			<input type="hidden" th:field="*{version}">
			<div th:if="${item == null}">
				<label for="type" class="form-label">종류</label>
				<select id="type" th:field="*{type}" class="form-input">
					<option th:each="t : ${types}" th:value="${t.name()}" th:text="${t.label}">기타</option>
				</select>
				<p class="form-error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}">오류</p>
			</div>
			<p th:unless="${item == null}" class="text-lg">종류: <strong th:text="${item.typeLabel()}">월세</strong></p>
			<input th:unless="${item == null}" type="hidden" th:field="*{type}">
			<div>
				<label for="label" class="form-label">이름 (비워 두면 종류 이름)</label>
				<p id="label-hint" class="mb-2 text-base text-gray-700">예: 10월 전기 요금</p>
				<input id="label" type="text" th:field="*{label}" class="form-input" aria-describedby="label-hint"
					th:attr="aria-invalid=${#fields.hasErrors('label')}">
				<p class="form-error" th:if="${#fields.hasErrors('label')}" th:errors="*{label}">오류</p>
			</div>
			<div>
				<label for="amount" class="form-label">금액 (원)</label>
				<input id="amount" type="text" inputmode="numeric" th:field="*{amount}" class="form-input"
					th:attr="aria-invalid=${#fields.hasErrors('amount')}">
				<p class="form-error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}">오류</p>
			</div>
			<div>
				<label for="memo" class="form-label">메모 (없으면 비워 두세요)</label>
				<p id="memo-hint" class="mb-2 text-base text-gray-700">주민번호·계좌번호는 적지 마세요.</p>
				<input id="memo" type="text" th:field="*{memo}" class="form-input" aria-describedby="memo-hint">
				<p class="form-error" th:if="${#fields.hasErrors('memo')}" th:errors="*{memo}">오류</p>
			</div>
			<button type="submit" class="btn btn-primary w-full" th:text="${item == null} ? '추가하기' : '고치기'">추가하기</button>
		</form>
		<a th:href="@{/app/charges/{id}(id=${charge.id()})}" class="btn btn-secondary mt-4 w-full">돌아가기</a>
	</main>
</body>
</html>
