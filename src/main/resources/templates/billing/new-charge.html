<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
<title>받을 월세 만들기 - RentKeeper</title>
</head>
<body>
	<main id="main" class="mx-auto w-full max-w-2xl flex-1 px-4 py-8">
		<p class="mb-2 text-lg"><a th:href="@{/app/leases/{id}(id=${view.leaseId()})}" class="font-semibold text-brand-700 underline">계약으로 돌아가기</a></p>
		<h1 class="mb-2 text-3xl font-bold">받을 월세 만들기</h1>
		<p class="mb-6 text-xl" th:text="${view.unitName()} + ' · ' + ${view.tenantName()} + '님'">행복빌라 101호 · 홍길동님</p>

		<div class="alert alert-error mb-6 text-lg" role="alert" th:if="${error}" th:text="${error}">안내</div>

		<!-- 달 고르기: 받을 월세가 없는 달만 (들어오는 달 ~ 다음 달, M3-b 결정 7) -->
		<section th:if="${view.month() == null}" aria-labelledby="months-heading">
			<h2 id="months-heading" class="mb-3 text-xl font-bold">어느 달 받을 월세를 만들까요?</h2>
			<p th:if="${view.months().isEmpty()}" class="rounded-lg border-2 border-dashed border-gray-400 bg-white p-5 text-lg">
				만들 수 있는 달이 없어요. 계약 기간 안의 달은 모두 받을 월세가 있어요.
			</p>
			<ul th:unless="${view.months().isEmpty()}" class="flex flex-wrap gap-3">
				<li th:each="m : ${view.months()}">
					<a th:href="@{/app/leases/{id}/charges/new(id=${view.leaseId()},month=${m})}" class="btn btn-secondary"
						th:text="${m.year} + '년 ' + ${m.monthValue} + '월'">2026년 10월</a>
				</li>
			</ul>
		</section>

		<!-- 고른 달: 금액을 확인하고 만든다 (M3-b 결정 8) -->
		<form th:if="${view.month() != null}" th:action="@{/app/leases/{id}/charges(id=${view.leaseId()})}" th:object="${form}"
			method="post" class="space-y-6" novalidate>
			<input type="hidden" th:field="*{month}">
			<p class="text-2xl font-bold"><span th:text="${view.month().year} + '년 ' + ${view.month().monthValue} + '월'">2026년 10월</span> 받을 월세</p>
			<p class="text-lg">납부일 <strong th:text="${#temporals.format(view.dueDate(), 'yyyy년 M월 d일')}">2026년 10월 5일</strong></p>
			<p class="text-base text-gray-700">이 달 계약 금액을 미리 채웠어요. 한 달 중간에 들어왔거나 나갔다면 금액을 고쳐서 만드세요.</p>
			<div>
				<label for="monthlyRent" class="form-label">월세 (원)</label>
				<input id="monthlyRent" type="text" inputmode="numeric" th:field="*{monthlyRent}" class="form-input"
					th:attr="aria-invalid=${#fields.hasErrors('monthlyRent')}">
				<p class="form-error" th:if="${#fields.hasErrors('monthlyRent')}" th:errors="*{monthlyRent}">오류</p>
			</div>
			<div>
				<label for="maintenanceFee" class="form-label">관리비 (원, 없으면 비워 두세요)</label>
				<input id="maintenanceFee" type="text" inputmode="numeric" th:field="*{maintenanceFee}" class="form-input"
					th:attr="aria-invalid=${#fields.hasErrors('maintenanceFee')}">
				<p class="form-error" th:if="${#fields.hasErrors('maintenanceFee')}" th:errors="*{maintenanceFee}">오류</p>
			</div>
			<button type="submit" class="btn btn-primary w-full">만들기</button>
		</form>
		<a th:if="${view.month() != null}" th:href="@{/app/leases/{id}/charges/new(id=${view.leaseId()})}"
			class="btn btn-secondary mt-4 w-full">다른 달 고르기</a>
	</main>
</body>
</html>
