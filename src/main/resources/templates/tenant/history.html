<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{tenant/layout :: layout(~{::title}, ~{::main})}">
<head>
<title>지난 기록 - 월세 안내</title>
</head>
<body>
	<!--/* 지난 기록 (TEN-4): 최근 12개월, 최근 달이 위. 취소된 달은 보이지 않는다 */-->
	<main id="main" class="page-tenant">
		<p class="mb-4"><a th:href="@{/t/{token}(token=${token})}" class="link">월세 안내로 돌아가기</a></p>
		<h1 class="page-title">지난 기록</h1>
		<p class="mb-6" th:text="${lease.unitName()} + ' · 최근 12개월'">행복빌라 101호 · 최근 12개월</p>

		<p th:if="${charges.isEmpty()}" class="card card-empty">아직 기록이 없어요.</p>

		<ul th:unless="${charges.isEmpty()}" class="stack">
			<li th:each="c : ${charges}" class="card">
				<div class="flex flex-wrap items-center justify-between gap-3">
					<p class="card-title" th:text="${c.monthText()}">2026년 10월</p>
					<span th:class="${c.statusBadge()}"><th:block th:replace="~{fragments/icons :: status(${c.statusBadge()}, ${c.status().name()})}"></th:block><span th:text="${c.statusText()}">입금이 확인됐어요</span></span>
				</div>
				<dl class="facts mt-4 sm:grid-cols-2">
					<div><dt class="stat-label">월세</dt> <dd class="row-value" th:text="${c.totalText()}">550,000원</dd></div>
					<div><dt class="stat-label">확인된 금액</dt> <dd class="row-value" th:text="${c.paidText()}">550,000원</dd></div>
				</dl>
			</li>
		</ul>
	</main>
</body>
</html>
