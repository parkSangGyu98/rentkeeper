<!DOCTYPE html>
<!--
  공통 레이아웃. 각 페이지는 자기 <title>과 <main>을 넘겨 쓴다:
    <html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
  CSP(script-src/style-src 'self') 때문에 인라인 스크립트·스타일 속성·이벤트 속성은 쓰지 않는다 (TemplateGuardTest가 검사).
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	th:fragment="layout(title, content)">
<head>
<meta charset="UTF-8">
<!-- 확대를 막지 않는다 (maximum-scale 없음, PRD 8.5) -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:replace="${title}">RentKeeper</title>
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="flex min-h-screen flex-col">
	<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:bg-white focus:p-3">본문 바로가기</a>

	<header class="border-b-2 border-gray-200 bg-white">
		<div class="mx-auto flex w-full max-w-2xl items-center justify-between px-4 py-3">
			<a th:href="@{/}" class="text-xl font-bold text-gray-900 no-underline">RentKeeper</a>
			<nav class="flex items-center gap-3" aria-label="계정">
				<th:block sec:authorize="!isAuthenticated()">
					<a th:href="@{/login}" class="btn btn-secondary">로그인</a>
					<a th:href="@{/signup}" class="btn btn-primary">가입하기</a>
				</th:block>
				<th:block sec:authorize="hasRole('LANDLORD')">
					<a th:href="@{/app}" class="hidden text-lg font-semibold text-gray-900 no-underline sm:inline">
						<span sec:authentication="principal.displayName">홍길동</span>님
					</a>
					<a th:href="@{/app/dashboard}" class="text-lg font-semibold text-brand-700 underline">한눈에 보기</a>
					<a th:href="@{/app/charges}" class="text-lg font-semibold text-brand-700 underline">받을 월세</a>
					<a th:href="@{/app/properties}" class="text-lg font-semibold text-brand-700 underline">내 건물</a>
					<a th:href="@{/app/settings}" class="text-lg font-semibold text-brand-700 underline">계정 설정</a>
					<!-- 로그아웃은 POST만 받는다. th:action이 CSRF 토큰을 넣는다 -->
					<form th:action="@{/logout}" method="post">
						<button type="submit" class="btn btn-secondary">로그아웃</button>
					</form>
				</th:block>
				<!-- 카카오 가입 단계(아직 계정 없음)에서는 그만두기만 보여 준다 -->
				<th:block sec:authorize="hasAuthority('ROLE_KAKAO_SIGNUP')">
					<form th:action="@{/logout}" method="post">
						<button type="submit" class="btn btn-secondary">가입 그만두기</button>
					</form>
				</th:block>
			</nav>
		</div>
	</header>

	<!-- 이메일 안내 띠 (EmailVerificationBannerAdvice). 인증 전에도 쓸 수 있지만 알림은 인증된 주소로만 간다 -->
	<div class="border-b-2 border-yellow-500 bg-yellow-50" role="status" th:if="${emailBanner != null and emailBanner.missing}">
		<div class="mx-auto flex w-full max-w-2xl flex-wrap items-center gap-3 px-4 py-3 text-base">
			<p class="flex-1">알림 받을 이메일이 아직 없어요. 이메일을 넣고 인증해야 월세 알림을 받을 수 있어요.</p>
			<a th:href="@{/app/settings/notification-email}" class="btn btn-secondary">이메일 넣기</a>
		</div>
	</div>
	<div class="border-b-2 border-yellow-500 bg-yellow-50" role="status" th:if="${emailBanner != null and emailBanner.unverified}">
		<div class="mx-auto flex w-full max-w-2xl flex-wrap items-center gap-3 px-4 py-3 text-base">
			<p class="flex-1">이메일 인증이 아직 끝나지 않았어요. 인증해야 월세 알림을 이메일로 받을 수 있어요.</p>
			<form th:action="@{/app/email-verification/resend}" method="post">
				<button type="submit" class="btn btn-secondary">인증 메일 다시 받기</button>
			</form>
			<!-- 카카오 계정은 주소를 잘못 넣었을 때 여기서 고친다 (일반 계정은 계정 설정의 이메일 바꾸기) -->
			<a th:if="${emailBanner.editable}" th:href="@{/app/settings/notification-email}"
				class="text-lg font-semibold text-brand-700 underline">주소 고치기</a>
		</div>
	</div>

	<!-- 한 번만 보여 주는 안내 (리다이렉트 후 flash 속성) -->
	<div class="mx-auto w-full max-w-2xl px-4 pt-6" th:if="${notice}">
		<div class="alert alert-info mb-0" role="status" th:text="${notice}">안내</div>
	</div>

	<main id="main" class="mx-auto w-full max-w-2xl flex-1 px-4 py-8" th:replace="${content}">
	</main>

	<footer class="border-t-2 border-gray-200 bg-white">
		<div class="mx-auto flex w-full max-w-2xl flex-wrap gap-x-6 gap-y-2 px-4 py-6 text-base text-gray-700">
			<a th:href="@{/terms}" class="underline">이용약관</a>
			<a th:href="@{/privacy}" class="font-semibold underline">개인정보처리방침</a>
		</div>
	</footer>
</body>
</html>
