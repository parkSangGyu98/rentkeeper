<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
<title th:text="|비밀번호 바꾸기 - #{app.name}|">비밀번호 바꾸기</title>
</head>
<body>
	<main id="main" class="mx-auto w-full max-w-2xl flex-1 px-4 py-8">
		<h1 class="mb-2 text-3xl font-bold">비밀번호 바꾸기</h1>
		<p class="mb-8 text-lg text-gray-700">본인 확인을 위해 지금 쓰는 비밀번호를 먼저 입력해 주세요.</p>

		<div class="alert alert-error" role="alert" th:if="${error}" th:text="${error}">오류</div>

		<form th:action="@{/app/settings/password}" method="post" class="space-y-6" novalidate>
			<div>
				<label for="currentPassword" class="form-label">지금 비밀번호</label>
				<input id="currentPassword" name="currentPassword" type="password" class="form-input"
					autocomplete="current-password" required>
			</div>
			<div>
				<label for="newPassword" class="form-label">새 비밀번호</label>
				<p id="new-password-hint" class="mb-2 text-base text-gray-700">8자 이상으로 정해 주세요. 너무 흔한 비밀번호나 이메일과 같은 비밀번호는 쓸 수 없어요.</p>
				<input id="newPassword" name="newPassword" type="password" class="form-input" autocomplete="new-password"
					aria-describedby="new-password-hint" required>
			</div>
			<div>
				<label for="newPasswordConfirm" class="form-label">새 비밀번호 확인</label>
				<input id="newPasswordConfirm" name="newPasswordConfirm" type="password" class="form-input"
					autocomplete="new-password" required>
			</div>
			<button type="submit" class="btn btn-primary w-full">비밀번호 바꾸기</button>
		</form>

		<p class="mt-8 text-lg"><a th:href="@{/app/settings}" class="font-semibold text-brand-700 underline">계정 설정으로 돌아가기</a></p>
	</main>
</body>
</html>
