<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
<title>호실 정보 바꾸기 - RentKeeper</title>
</head>
<body>
	<main id="main" class="mx-auto w-full max-w-2xl flex-1 px-4 py-8">
		<p class="mb-2 text-lg"><a th:href="@{/app/properties/{id}(id=${unit.propertyId})}" class="font-semibold text-brand-700 underline" th:text="${unit.propertyName}">행복빌라</a></p>
		<h1 class="mb-6 text-3xl font-bold">호실 정보 바꾸기</h1>

		<div class="alert alert-error" role="alert" th:if="${#fields.hasErrors('${form.*}')}">입력한 내용을 확인해 주세요.</div>

		<form th:action="@{/app/units/{id}(id=${unit.id})}" th:object="${form}" method="post" class="space-y-6" novalidate>
			<div>
				<label for="name" class="form-label">호실 이름</label>
				<input id="name" type="text" th:field="*{name}" class="form-input" maxlength="20" required
					th:attr="aria-invalid=${#fields.hasErrors('name')}">
				<p class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">이름 오류</p>
			</div>
			<div>
				<label for="type" class="form-label">유형</label>
				<select id="type" th:field="*{type}" class="form-input">
					<option th:each="t : ${unitTypes}" th:value="${t}" th:text="${t.label()}">원룸</option>
				</select>
				<p class="form-error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}">유형 오류</p>
			</div>
			<div>
				<label for="memo" class="form-label">메모 (선택)</label>
				<p id="memo-hint" class="mb-2 text-base text-gray-700">주민번호·계좌번호는 적지 마세요.</p>
				<textarea id="memo" th:field="*{memo}" rows="3" maxlength="500" class="form-input py-3" aria-describedby="memo-hint"></textarea>
				<p class="form-error" th:if="${#fields.hasErrors('memo')}" th:errors="*{memo}">메모 오류</p>
			</div>
			<button type="submit" class="btn btn-primary w-full">바꾸기</button>
		</form>
	</main>
</body>
</html>
