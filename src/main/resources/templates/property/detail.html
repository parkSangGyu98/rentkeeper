<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
<title>건물 상세 - RentKeeper</title>
</head>
<body>
	<main id="main" class="mx-auto w-full max-w-2xl flex-1 px-4 py-8">
		<p class="mb-2 text-lg"><a th:href="@{/app/properties}" class="font-semibold text-brand-700 underline">내 건물</a></p>
		<h1 class="mb-1 text-3xl font-bold" th:text="${property.name}">행복빌라</h1>
		<p class="mb-2 text-lg text-gray-700" th:if="${property.address}" th:text="${property.address}">주소</p>
		<p class="mb-4 whitespace-pre-line text-base text-gray-700" th:if="${property.memo}" th:text="${property.memo}">메모</p>
		<div class="mb-8 flex flex-wrap gap-3">
			<a th:href="@{/app/properties/{id}/edit(id=${property.id})}" class="btn btn-secondary">건물 정보 바꾸기</a>
			<a th:href="@{/app/properties/{id}/delete(id=${property.id})}" class="btn btn-secondary">건물 지우기</a>
		</div>

		<h2 class="mb-4 text-2xl font-bold">호실</h2>

		<!-- 빈 상태 -->
		<p th:unless="${property.hasUnits()}" class="mb-6 rounded-lg border-2 border-dashed border-gray-400 bg-white p-5 text-lg">
			아직 호실이 없어요. 아래에서 첫 호실을 추가해 보세요.
		</p>

		<ul th:if="${property.hasUnits()}" class="mb-8 space-y-3">
			<li th:each="u : ${property.units}" class="rounded-lg border-2 border-gray-200 bg-white p-4">
				<div class="flex flex-wrap items-center justify-between gap-3">
					<div>
						<p class="text-xl font-bold" th:text="${u.name}">101호</p>
						<p class="text-base text-gray-700" th:text="${u.type.label()}">원룸</p>
					</div>
					<span class="badge"
						th:classappend="${u.status.name() == 'OCCUPIED'} ? 'badge-occupied' : (${u.status.name() == 'UPCOMING'} ? 'badge-upcoming' : (${u.status.name() == 'OVERDUE'} ? 'badge-overdue' : 'badge-vacant'))"
						th:text="${u.status.label()}">공실</span>
				</div>
				<div class="mt-3 flex flex-wrap gap-4 text-lg">
					<a th:href="@{/app/units/{id}/edit(id=${u.id})}" class="font-semibold text-brand-700 underline">바꾸기</a>
					<a th:href="@{/app/units/{id}/delete(id=${u.id})}" class="font-semibold text-brand-700 underline">지우기</a>
				</div>
			</li>
		</ul>

		<section class="rounded-lg border-2 border-gray-200 bg-white p-5" aria-labelledby="add-unit-heading">
			<h2 id="add-unit-heading" class="mb-4 text-xl font-bold">호실 추가</h2>
			<div class="alert alert-error" role="alert" th:if="${#fields.hasErrors('${unitForm.*}')}">입력한 내용을 확인해 주세요.</div>
			<form th:action="@{/app/properties/{id}/units(id=${property.id})}" th:object="${unitForm}" method="post" class="space-y-5" novalidate>
				<div>
					<label for="unit-name" class="form-label">호실 이름</label>
					<p id="unit-name-hint" class="mb-2 text-base text-gray-700">예: 101호, 1층 상가</p>
					<input id="unit-name" type="text" th:field="*{name}" class="form-input" maxlength="20" required
						th:attr="aria-invalid=${#fields.hasErrors('name')},aria-describedby=${#fields.hasErrors('name')} ? 'unit-name-hint unit-name-error' : 'unit-name-hint'">
					<p id="unit-name-error" class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">이름 오류</p>
				</div>
				<div>
					<label for="unit-type" class="form-label">유형</label>
					<select id="unit-type" th:field="*{type}" class="form-input">
						<option th:each="t : ${unitTypes}" th:value="${t}" th:text="${t.label()}">원룸</option>
					</select>
					<p class="form-error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}">유형 오류</p>
				</div>
				<div>
					<label for="unit-memo" class="form-label">메모 (선택)</label>
					<p id="unit-memo-hint" class="mb-2 text-base text-gray-700">주민번호·계좌번호는 적지 마세요.</p>
					<textarea id="unit-memo" th:field="*{memo}" rows="2" maxlength="500" class="form-input py-3" aria-describedby="unit-memo-hint"></textarea>
					<p class="form-error" th:if="${#fields.hasErrors('memo')}" th:errors="*{memo}">메모 오류</p>
				</div>
				<button type="submit" class="btn btn-primary w-full">호실 추가</button>
			</form>
		</section>
	</main>
</body>
</html>
