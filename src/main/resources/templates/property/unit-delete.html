<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
<title>호실 지우기 - RentKeeper</title>
</head>
<body>
	<main id="main" class="mx-auto w-full max-w-2xl flex-1 px-4 py-8">
		<h1 class="mb-4 text-3xl font-bold">호실을 지울까요?</h1>
		<p class="mb-2 text-xl font-semibold" th:text="${unit.displayName()}">행복빌라 101호</p>
		<p class="mb-8 text-lg text-gray-700">지우면 되돌릴 수 없어요. 계약 기록이 있는 호실은 지울 수 없어요.</p>
		<form th:action="@{/app/units/{id}/delete(id=${unit.id})}" method="post" class="mb-4">
			<button type="submit" class="btn btn-danger w-full">네, 지울게요</button>
		</form>
		<a th:href="@{/app/properties/{id}(id=${unit.propertyId})}" class="btn btn-secondary w-full">지우지 않고 돌아가기</a>
	</main>
</body>
</html>
