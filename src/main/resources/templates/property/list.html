<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
<title th:text="|내 건물 - #{app.name}|">내 건물</title>
</head>
<body>
	<main id="main" class="page-wide">
		<div class="mb-6 flex flex-wrap items-center justify-between gap-3">
			<h1 class="text-3xl font-bold">내 건물</h1>
			<a th:href="@{/app/properties/new}" class="btn btn-primary">건물 추가</a>
		</div>

		<!-- 빈 상태 (PRD 6.3) -->
		<section th:if="${properties.isEmpty()}" class="rounded-lg border-2 border-dashed border-gray-400 bg-white p-6 text-center">
			<p class="mb-2 text-xl font-bold">첫 건물을 등록해 보세요</p>
			<p class="mb-6 text-lg text-gray-700">건물을 등록하고 호실을 추가하면, 호실마다 계약을 넣을 수 있어요.</p>
			<a th:href="@{/app/properties/new}" class="btn btn-primary">건물 등록하기</a>
		</section>

		<ul th:unless="${properties.isEmpty()}" class="space-y-4">
			<li th:each="p : ${properties}">
				<a th:href="@{/app/properties/{id}(id=${p.id})}"
					class="block rounded-lg border-2 border-gray-200 bg-white p-5 no-underline hover:border-brand-700">
					<p class="text-xl font-bold text-gray-900" th:text="${p.name}">행복빌라</p>
					<p class="mt-1 text-base text-gray-700" th:if="${p.address}" th:text="${p.address}">서울시 ...</p>
					<p class="mt-3 text-lg text-gray-900">
						호실 <strong th:text="${p.unitCount}">10</strong>개 ·
						입주중 <strong th:text="${p.occupiedCount}">8</strong> ·
						공실 <strong th:text="${p.vacantCount}">2</strong>
					</p>
				</a>
			</li>
		</ul>
	</main>
</body>
</html>
