<!DOCTYPE html>
<!--/* 404·403·500 외의 오류 공통 화면. 상태 코드 외의 내부 정보(예외, 스택트레이스)는 보여 주지 않는다 */-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
<title th:text="|요청을 처리하지 못했어요 - #{app.name}|">요청을 처리하지 못했어요</title>
</head>
<body>
	<main id="main" class="page">
		<h1 class="page-title">요청을 처리하지 못했어요</h1>
		<p class="mb-8 text-gray-700">
			입력한 내용을 확인한 뒤 다시 시도해 주세요. <span class="text-gray-500" th:if="${status}" th:text="|(오류 코드 ${status})|">(오류 코드 400)</span>
		</p>
		<a th:href="@{/}" class="btn btn-primary">처음 화면으로</a>
	</main>
</body>
</html>
