<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
<title th:text="|비밀번호 재설정 - #{app.name}|">비밀번호 재설정</title>
</head>
<body>
	<main id="main" class="mx-auto w-full max-w-2xl flex-1 px-4 py-8">
		<th:block th:if="${state == 'SENT'}">
			<h1 class="mb-4 text-3xl font-bold">메일을 확인해 주세요</h1>
			<!-- 가입 여부를 알려 주지 않는다: 가입된 이메일이든 아니든 항상 같은 안내 -->
			<p class="mb-4 text-lg text-gray-700">입력하신 주소로 가입되어 있다면 비밀번호 재설정 메일을 보냈어요.</p>
			<p class="mb-8 text-lg text-gray-700">메일이 안 보이면 스팸함도 확인해 주세요. 메일의 링크는 30분 동안 쓸 수 있어요.</p>
			<a th:href="@{/login}" class="btn btn-primary">로그인 화면으로</a>
		</th:block>

		<th:block th:unless="${state == 'SENT'}">
			<h1 class="mb-2 text-3xl font-bold">비밀번호 재설정</h1>
			<p class="mb-8 text-lg text-gray-700">가입할 때 쓴 이메일을 입력하면, 새 비밀번호를 정할 수 있는 링크를 보내 드려요.</p>
			<form th:action="@{/password-reset}" method="post" class="space-y-6" novalidate>
				<div>
					<label for="email" class="form-label">이메일</label>
					<input id="email" name="email" type="email" class="form-input" autocomplete="email" inputmode="email"
						required>
				</div>
				<button type="submit" class="btn btn-primary w-full">재설정 메일 받기</button>
			</form>
			<p class="mt-8 text-lg">
				비밀번호가 생각났나요? <a th:href="@{/login}" class="font-semibold text-brand-700 underline">로그인</a>
			</p>
		</th:block>
	</main>
</body>
</html>
