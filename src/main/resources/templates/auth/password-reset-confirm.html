<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
<title th:text="|새 비밀번호 정하기 - #{app.name}|">새 비밀번호 정하기</title>
</head>
<body>
	<main id="main" class="page">
		<th:block th:if="${state == 'FORM'}">
			<h1 class="page-title">새 비밀번호 정하기</h1>
			<p class="mb-8 text-gray-700">새 비밀번호로 바꾸면 모든 기기에서 로그아웃돼요. 새 비밀번호로 다시 로그인해 주세요.</p>

			<div class="alert alert-error" role="alert" th:if="${passwordError}" th:text="${passwordError}">오류</div>

			<!--/* 링크를 여는 것(GET)만으로는 토큰을 쓰지 않는다. 이 버튼(POST)을 눌러야 바뀐다 (ADR-011) */-->
			<form th:action="@{/password-reset/confirm}" method="post" class="card space-y-6" novalidate>
				<input type="hidden" name="token" th:value="${token}">
				<div>
					<label for="password" class="form-label">새 비밀번호</label>
					<p id="password-hint" class="mb-2 note">8자 이상으로 정해 주세요. 너무 흔한 비밀번호나 이메일과 같은 비밀번호는 쓸 수 없어요.</p>
					<input id="password" name="password" type="password" class="form-input" autocomplete="new-password"
						aria-describedby="password-hint" required>
				</div>
				<div>
					<label for="passwordConfirm" class="form-label">새 비밀번호 확인</label>
					<input id="passwordConfirm" name="passwordConfirm" type="password" class="form-input"
						autocomplete="new-password" required>
				</div>
				<button type="submit" class="btn btn-primary w-full">비밀번호 바꾸기</button>
			</form>
		</th:block>

		<th:block th:unless="${state == 'FORM'}">
			<h1 class="page-title">링크가 만료됐거나 이미 사용됐어요</h1>
			<p class="mb-8 text-gray-700">재설정 링크는 30분 동안, 한 번만 쓸 수 있어요. 새 링크를 다시 받아 주세요.</p>
			<a th:href="@{/password-reset}" class="btn btn-primary">재설정 메일 다시 받기</a>
		</th:block>
	</main>
</body>
</html>
