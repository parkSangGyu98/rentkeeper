<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
<title>계약 확인 - RentKeeper</title>
</head>
<body>
	<main id="main" class="mx-auto w-full max-w-2xl flex-1 px-4 py-8">
		<h1 class="mb-2 text-3xl font-bold">이대로 등록할까요?</h1>
		<p class="mb-6 text-xl font-semibold" th:text="${unit.displayName()}">행복빌라 101호</p>

		<!-- 같은 연락처의 세입자가 이미 있다 (M2 결정 6) -->
		<div class="alert alert-info" role="status" th:if="${existingTenant != null}">
			<p class="mb-1 font-bold">이미 등록된 세입자로 계약할까요?</p>
			<p>같은 휴대폰 번호로 <strong th:text="${existingTenant.name()}">홍길동</strong>
				(<span th:text="${existingTenant.phone()}">010-1234-5678</span>) 님이 이미 있어요.
				등록하면 이 세입자의 계약으로 넣고, 지금 입력한 이름·세입자 메모는 쓰지 않아요.</p>
		</div>

		<dl class="mb-8 space-y-4 rounded-lg border-2 border-gray-200 bg-white p-5 text-lg">
			<div th:if="${existingTenant == null}">
				<dt class="font-semibold">세입자</dt>
				<dd th:text="${registration.tenantName().value()} + ' · ' + ${registration.tenantPhone().formatted()}">홍길동 · 010-1234-5678</dd>
			</div>
			<div>
				<dt class="font-semibold">보증금</dt>
				<dd th:text="${registration.depositText()}">10,000,000원</dd>
			</div>
			<div>
				<dt class="font-semibold">월세 · 관리비</dt>
				<dd th:text="${registration.rentText()} + ' · 관리비 ' + ${registration.feeText()}">500,000원 · 50,000원</dd>
			</div>
			<div>
				<dt class="font-semibold">월세 받는 날</dt>
				<dd th:text="${registration.dueDayText()}">매달 5일</dd>
			</div>
			<div>
				<dt class="font-semibold">기간</dt>
				<dd>들어오는 날 <span th:text="${#temporals.format(registration.terms().startDate(), 'yyyy년 M월 d일')}">2026년 1월 1일</span>
					· 나가는 날 <span th:text="${#temporals.format(registration.terms().endDate(), 'yyyy년 M월 d일')}">2027년 1월 1일</span></dd>
			</div>
			<div>
				<dt class="font-semibold">월세 받을 계좌</dt>
				<dd th:text="${registration.terms().bankName()} + ' ' + ${registration.terms().accountNumber().digits()} + ' (예금주 ' + ${registration.terms().accountHolder().value()} + ')'">국민은행 123456789 (예금주 김임대)</dd>
			</div>
		</dl>

		<!-- 입력값은 세션에 두지 않고 숨은 칸으로 다시 보낸다 (세션은 DB에 평문으로 저장되므로) -->
		<form th:action="@{/app/leases}" th:object="${form}" method="post" class="mb-4">
			<th:block th:replace="~{lease/fields :: hidden}"></th:block>
			<input type="hidden" name="useExistingTenant" th:value="${existingTenant != null}">
			<button type="submit" class="btn btn-primary w-full"
				th:text="${existingTenant != null} ? '네, 이 세입자로 등록할게요' : '등록하기'">등록하기</button>
		</form>
		<form th:action="@{/app/leases/edit-draft}" th:object="${form}" method="post">
			<th:block th:replace="~{lease/fields :: hidden}"></th:block>
			<button type="submit" class="btn btn-secondary w-full">고치기</button>
		</form>
	</main>
</body>
</html>
