<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
<title>세입자 링크 닫기 - RentKeeper</title>
</head>
<body>
	<main id="main" class="mx-auto w-full max-w-2xl flex-1 px-4 py-8">
		<h1 class="mb-4 text-3xl font-bold">세입자 링크를 닫을까요?</h1>
		<p class="mb-2 text-xl font-semibold" th:text="${lease.unitName()} + ' · ' + ${lease.tenantName()} + '님'">행복빌라 101호 · 홍길동님</p>
		<th:block th:if="${tenantLink.open()}">
			<ul class="mb-8 list-disc space-y-1 pl-6 text-lg text-gray-700">
				<li>닫으면 세입자는 지금 링크로 더 이상 들어올 수 없어요. 닫은 링크는 다시 열 수 없어요.</li>
				<li>링크를 잘못 보냈거나 다른 사람이 알게 됐을 때 닫아 주세요. 필요하면 새 링크를 만들 수 있어요.</li>
			</ul>
			<form th:action="@{/app/leases/{id}/tenant-link/close(id=${lease.leaseId()})}" method="post" class="mb-4">
				<input type="hidden" name="openLinkId" th:value="${tenantLink.openLinkIdParam()}">
				<button type="submit" class="btn btn-danger w-full">네, 링크를 닫을게요</button>
			</form>
		</th:block>
		<p th:unless="${tenantLink.open()}" class="mb-6 text-lg">지금 열린 세입자 링크가 없어요.</p>
		<a th:href="@{/app/leases/{id}(id=${lease.leaseId()})}" class="btn btn-secondary w-full">돌아가기</a>
	</main>
</body>
</html>
