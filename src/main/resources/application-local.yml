app:
  # 메일 링크의 기준 주소. 운영은 환경변수 APP_BASE_URL로 지정한다 (AppProperties)
  base-url: http://localhost:8080

spring:
  config:
    # 루트의 .env를 프로퍼티로 읽는다. PowerShell에서 환경변수를 따로 설정하지 않아도
    # docker compose와 앱이 같은 접속 정보를 쓴다. 파일이 없으면 무시한다(CI 등).
    import: optional:file:.env[.properties]
  thymeleaf:
    # 개발 중에는 템플릿을 소스 폴더에서 바로 읽고 캐시하지 않는다 → 저장 후 새로고침만 하면 반영
    prefix: file:src/main/resources/templates/
    cache: false
  web:
    resources:
      # 개발 중에는 tailwindWatch가 다시 만든 CSS를 앱 재시작 없이 바로 쓴다 (상대 경로 = 프로젝트 폴더에서 bootRun 기준)
      static-locations: file:build/generated/tailwind/static/, classpath:/static/
